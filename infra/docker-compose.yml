version: "3.8"
services:
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: ukpath_web:dev
    ports:
      - "3000:3000"
    env_file:
      - ../web/.env.test
    volumes:
      - ../web:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: ukpath_api:dev
    ports:
      - "4000:4000"
    env_file:
      - ../api/.env.test
    volumes:
      - ../api:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: ukpath_test
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
